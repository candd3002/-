name: signal monitor
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
# Never two runs at once: overlapping runs would read the same old state and send the same alert twice.
concurrency:
  group: signal-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: restore monitor state
        uses: actions/cache@v4
        with:
          path: alerts-state.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-
      - name: run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/monitor.mjs
