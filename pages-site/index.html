<title>Baqer Sniper</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Readex+Pro:wght@600;800&family=Tajawal:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: pro trading app shell. Sidebar nav (desktop) / bottom nav (phone), top bar, routed screens. Single deliberate dark luxury theme. */
:root{
  --bg:#0a0a0b; --surface:#121110; --surface2:#1a1816; --line:#2a2620; --line2:#1e1c19;
  --ivory:#f4efe6; --muted:#a39b8d; --gold:#d4af6a; --gold-soft:rgba(212,175,106,.12);
  --sell:#e5484d; --buy:#3fb68b; --liq:#6ea8ff; --rsi:#b48cff;
  --f-display:'El Messiri',Georgia,serif; --f-body:Tajawal,system-ui,sans-serif; --f-num:'DM Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ivory);font-family:var(--f-body);font-size:15px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--gold)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
.up{color:var(--buy)} .dn{color:var(--sell)} .mut{color:var(--muted)} .gold{color:var(--gold)}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;border-inline-end:1px solid var(--line);background:#0c0c0d;display:flex;flex-direction:column;gap:6px;padding:18px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 16px}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.1}
.brand b span{color:var(--gold)}
.brand small{display:block;font-family:var(--f-num);font-size:9.5px;letter-spacing:.28em;color:var(--muted)}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-size:14.5px;position:relative}
.nav a:hover{color:var(--ivory);background:var(--surface)}
.nav a[aria-current="page"]{color:var(--gold);background:var(--gold-soft)}
.nav a .badge{margin-inline-start:auto;font-family:var(--f-num);font-size:11px;background:var(--gold);color:#1a1408;border-radius:99px;padding:1px 7px}
.side .foot{margin-top:auto;font-size:11.5px;color:var(--muted);line-height:1.6;padding:8px}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px max(20px,env(safe-area-inset-left,0px)) 12px max(20px,env(safe-area-inset-right,0px));background:rgba(10,10,11,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar h1{margin:0;font-family:var(--f-display);font-size:22px;font-weight:600}
.searchbtn{margin-inline-start:auto;display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px}
.kbd{font-family:var(--f-num);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--buy)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;flex:0 0 auto}
.iconbtn .dot{position:absolute;top:7px;left:8px;width:8px;height:8px;border-radius:50%;background:var(--sell)}
.screen{padding:18px max(20px,env(safe-area-inset-right,0px)) 30px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;min-width:0;max-width:1520px;width:100%;margin:0 auto}
.bnav{display:none}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar h1{font-size:19px}
  .searchbtn span.t,.searchbtn .kbd{display:none}
  .topbar .pill{display:none}
  .screen{padding-bottom:110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0c0c0d;border-top:1px solid var(--line);padding:8px max(4px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  .bnav a{display:grid;justify-items:center;gap:3px;font-size:11px;color:var(--muted);text-decoration:none;min-height:46px;align-content:center}
  .bnav a[aria-current="page"]{color:var(--gold);font-weight:700}
}

/* common blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;position:relative;min-width:0}
.card.lux::before{content:"";position:absolute;top:0;right:28px;left:28px;height:1px;background:var(--gold)}
.card.lux.sell::before{background:var(--sell)} .card.lux.buy::before{background:var(--buy)}
.pad{padding:16px 18px}
.h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.h h2{margin:0;font-size:15px;font-weight:700}
.label{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:16px}
.g-home{grid-template-columns:1.25fr 1fr 1fr}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
@media (max-width:1100px){.g-home{grid-template-columns:1fr 1fr}}
@media (max-width:700px){.g-home{grid-template-columns:1fr}}
.btn{text-decoration:none;min-height:46px;border-radius:14px;border:0;background:var(--gold);color:#1a1408;font-weight:700;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ivory);font-weight:500}
.btn.outline{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.btn.sm{min-height:36px;border-radius:10px;padding:0 12px;font-size:13px}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;color:var(--muted);padding:10px 0;min-height:42px;border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--ivory);font-weight:700;border-bottom-color:var(--gold)}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.tag{display:inline-block;font-size:11px;border-radius:999px;padding:1px 9px;border:1px solid currentColor;white-space:nowrap}
.list{list-style:none;margin:0;padding:0}
.list > li{border-top:1px solid var(--line2)}
.list > li:first-child{border-top:0}
.empty{color:var(--muted);font-size:13px;margin:0}
.field{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.field input,.field select{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ivory);padding:0 12px;font-size:14px;width:100%}
.switch{width:44px;height:26px;border-radius:99px;border:0;background:var(--line);position:relative;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:right .15s}
.switch[aria-checked="true"]{background:var(--gold)}
.switch[aria-checked="true"]::after{right:22px;background:#1a1408}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px}
.spark{display:block}
.note{font-size:11.5px;color:var(--muted);line-height:1.7;margin:0}

/* home */
.hero h2{margin:4px 0 0;font-family:var(--f-display);font-size:36px;font-weight:700;line-height:1.15}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--f-num);font-weight:500;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* markets table */
.mtable{width:100%;border-collapse:collapse;font-size:14px}
.mtable th{font-size:12px;color:var(--muted);font-weight:500;text-align:start;padding:10px 8px;border-bottom:1px solid var(--line)}
.mtable td{padding:12px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.mtable tr.row{cursor:pointer}
.mtable tr.row:hover td{background:#141311}
.star{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--gold)}
.range{width:110px;height:4px;border-radius:9px;background:var(--line);position:relative}
.range i{position:absolute;top:-3px;width:2px;height:10px;background:var(--ivory)}
@media (max-width:700px){.mtable .hide-s{display:none}}

/* chart */
.chartwrap{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;align-items:start}
.chartwrap.full{grid-template-columns:minmax(0,1fr)}
.chartwrap.full .panel{display:none}
@media (max-width:1060px){.chartwrap{grid-template-columns:minmax(0,1fr)}}
.chartcard{display:grid;grid-template-columns:52px minmax(0,1fr);grid-template-rows:auto 1fr auto;overflow:hidden}
.bar{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.assetsel{display:flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.assetsel b{font-size:14px}
.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--bg);direction:ltr}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:6px 10px;font-family:var(--f-num);font-size:12.5px;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--gold);color:#1a1408}
.tog{min-height:32px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.tog i{width:8px;height:8px;border-radius:50%;background:currentColor}
.tog[aria-pressed="true"]{color:var(--ivory);border-color:#4a4236;background:var(--surface2)}
.spacer{flex:1}
.rail{display:flex;flex-direction:column;gap:4px;padding:8px 6px;border-inline-end:1px solid var(--line);align-items:center;overflow-y:auto;max-height:var(--sh);scrollbar-width:thin}
.tool{width:40px;height:40px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--muted);display:grid;place-items:center;flex:0 0 auto}
.tool:hover{color:var(--ivory);background:var(--surface2)}
.tool[aria-pressed="true"]{color:var(--gold);border-color:rgba(212,175,106,.5);background:var(--gold-soft)}
.rail hr{width:26px;border:0;border-top:1px solid var(--line);margin:4px 0}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0;flex:0 0 auto}
.sw[aria-pressed="true"]{border-color:var(--ivory)}
.chartcard{--sh:max(460px,min(70vh,660px))}
.chartwrap.full .chartcard{--sh:max(460px,calc(100vh - 210px))}
.stage{position:relative;min-width:0;height:var(--sh);touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ohlc{position:absolute;top:8px;left:10px;direction:ltr;font-family:var(--f-num);font-size:11.5px;color:var(--muted);pointer-events:none;display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100% - 90px)}
.ohlc b{color:var(--ivory);font-weight:400}
.hint{position:absolute;bottom:30px;right:12px;font-size:12px;background:rgba(10,10,11,.88);border:1px solid var(--line);border-radius:10px;padding:6px 10px;pointer-events:none}
.textin{position:absolute;z-index:3;min-width:140px;min-height:34px;border-radius:8px;border:1px solid var(--gold);background:#0a0a0b;color:var(--ivory);padding:0 8px;font-size:13px}
.cfoot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:12px;height:2px;vertical-align:middle;margin-inline-end:5px;background:var(--c)}
@media (max-width:700px){
  .chartcard{grid-template-columns:minmax(0,1fr)}
  .rail{flex-direction:row;overflow-x:auto;overflow-y:hidden;max-height:none;border-inline-end:0;border-bottom:1px solid var(--line);grid-column:1/-1}
  .rail hr{width:1px;height:26px;border-top:0;border-inline-start:1px solid var(--line);margin:0 4px}
  .chartcard{--sh:440px}
}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.decision{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.decision h2{margin:2px 0 0;font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1.15}
.lrow{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line2);font-size:14px}
.lrow:first-child{border-top:0}
.ldot{width:10px;height:10px;border-radius:50%}
.checks li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:13px}
.matrix{width:100%;border-collapse:collapse;font-family:var(--f-num);font-size:12.5px;text-align:center;direction:ltr}
.matrix th{font-weight:400;color:var(--muted);font-size:11px;padding:6px 2px;border-bottom:1px solid var(--line)}
.matrix td{padding:7px 2px;border-bottom:1px solid var(--line2)}
.matrix td:first-child{text-align:left;color:var(--ivory)}
.drawlist li{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px}
.drawlist .c{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.mini{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--muted);flex:0 0 auto}

/* orders */
.order{padding:16px}
.order .zone{margin-top:12px;border-radius:14px;padding:10px 12px;border:1px solid rgba(212,175,106,.35);background:rgba(212,175,106,.06);display:flex;justify-content:space-between;gap:10px;font-size:13px}
.kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center;font-size:11.5px;color:var(--muted)}
.kv3 b{display:block;font-family:var(--f-num);font-weight:500;font-size:14px;margin-top:2px;direction:ltr}
.bar5{height:5px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}
.bar5 i{display:block;height:100%;border-radius:9px}
.calc-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.calc-out div{border-radius:14px;border:1px solid var(--line);padding:12px;background:var(--bg)}
.calc-out b{display:block;font-family:var(--f-num);font-weight:500;font-size:19px;margin-top:4px;direction:ltr;text-align:right}

/* agenda */
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.days button{min-height:60px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px}
.days button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.timeline{position:relative;height:120px;margin-top:10px}
.tl-row{position:absolute;left:0;right:0;height:22px}
.tl-bar{position:absolute;top:0;height:14px;border-radius:7px}
.tl-lab{position:absolute;top:16px;font-size:11px;white-space:nowrap}
.tl-now{position:absolute;top:-6px;bottom:0;width:2px;background:var(--ivory);border-radius:2px}
.impact{display:inline-flex;gap:2px}
.impact i{width:6px;height:14px;border-radius:2px;background:var(--line)}

/* overlays */
.palette{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.palette .box{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.palette input{width:100%;min-height:56px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0 18px;font-size:16px;color:var(--ivory)}
.palette input:focus{outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.palette li button{width:100%;display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:12px;border:0;background:transparent;text-align:start}
.palette li button:hover,.palette li button.on{background:var(--gold-soft)}
.toasts{position:fixed;z-index:70;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100% - 40px))}
@media (max-width:860px){.toasts{bottom:calc(90px + env(safe-area-inset-bottom,0px))}}
.toast{background:var(--surface2);border:1px solid var(--line);border-inline-start:3px solid var(--gold);border-radius:14px;padding:12px 14px;font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.toast b{display:block;margin-bottom:2px}


/* ===== command center ===== */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}
@media (max-width:1280px){.bento{grid-template-columns:repeat(6,minmax(0,1fr))}.s4,.s5,.s6{grid-column:span 6}.s3{grid-column:span 3}}
@media (max-width:720px){.bento{grid-template-columns:minmax(0,1fr)}.bento>*{grid-column:auto!important}}
.eyebrow{font-family:var(--f-num);font-size:10.5px;letter-spacing:.22em;color:var(--gold);direction:ltr;text-align:right;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.eyebrow::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--buy);box-shadow:0 0 10px var(--buy);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.sechead h2{margin:0;font-family:var(--f-display);font-size:19px;font-weight:600}
.sechead .sub{font-size:12px;color:var(--muted)}
.bigprice{font-family:var(--f-num);font-size:clamp(36px,3.6vw,54px);font-weight:500;letter-spacing:-.02em;line-height:1.05;background:linear-gradient(180deg,#fff8e6 10%,#d4af6a 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(212,175,106,.35));direction:ltr;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:11.5px;color:var(--muted);background:rgba(0,0,0,.25)}
.mchip b{font-family:var(--f-num);font-weight:500;color:var(--ivory);font-size:12.5px}
.rbar{position:relative;height:6px;border-radius:9px;background:linear-gradient(90deg,rgba(229,72,77,.5),rgba(212,175,106,.5),rgba(63,182,139,.5))}
.rbar i{position:absolute;top:-5px;width:4px;height:16px;border-radius:3px;background:#fff;box-shadow:0 0 12px #fff}
.heat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:460px){.heat{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border-radius:16px;padding:12px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;border:1px solid rgba(255,255,255,.06);text-decoration:none;color:var(--ivory);transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tile .n{font-size:13px;font-weight:700}
.tile .c{display:block;unicode-bidi:isolate;font-family:var(--f-num);font-size:16px;direction:ltr;text-align:right}
.tile .p{display:block;unicode-bidi:isolate}
.tile .p{font-family:var(--f-num);font-size:11px;color:rgba(244,239,230,.7);direction:ltr;text-align:right}
.conf-row{display:grid;grid-template-columns:118px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:12.5px;padding:5px 0}
.cbar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.cbar i{display:block;height:100%;border-radius:9px;animation:grow 1.3s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 0 10px currentColor}
@keyframes grow{from{width:0}}
.needle{transform-origin:100px 100px;animation:needle 1.6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes needle{from{transform:rotate(-90deg)}}
.dialhand{transform-origin:100px 100px}
.minigrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.minigrid div{border-radius:12px;padding:8px 6px;text-align:center;font-size:10.5px;color:var(--muted);background:rgba(0,0,0,.3);border:1px solid var(--line2)}
.minigrid b{display:block;font-family:var(--f-num);font-weight:500;font-size:12.5px;margin-top:2px;direction:ltr}
.newsrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;font-size:13px}
.chartcard{grid-template-rows:auto auto 1fr auto}
.statstrip{grid-column:1/-1;display:flex;overflow-x:auto;border-bottom:1px solid var(--line);background:rgba(0,0,0,.18)}
.statstrip>div{padding:8px 16px;border-inline-end:1px solid var(--line2);white-space:nowrap;font-size:11px;color:var(--muted);display:flex;flex-direction:column;justify-content:center;gap:2px}
.statstrip b{font-family:var(--f-num);font-weight:500;font-size:13.5px;color:var(--ivory);direction:ltr;text-align:right}
.mtfchips{display:flex;gap:4px;direction:ltr}
.mtfchips span{font-family:var(--f-num);font-size:11px;padding:2px 7px;border-radius:7px}

/* ===== cinematic layer ===== */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(90px);opacity:.6}
.aurora i{position:absolute;border-radius:50%}
.aurora i:nth-child(1){width:48vw;height:48vw;background:radial-gradient(circle,rgba(212,175,106,.38),transparent 65%);top:4%;right:8%;animation:drift1 22s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:40vw;height:40vw;background:radial-gradient(circle,rgba(150,100,35,.34),transparent 65%);bottom:0;left:12%;animation:drift2 28s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:30vw;height:30vw;background:radial-gradient(circle,rgba(229,72,77,.14),transparent 65%);top:42%;left:46%;animation:drift1 34s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(-12vw,10vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(14vw,-12vh) scale(.9)}}
.shell{position:relative;z-index:1}
.side{background:rgba(8,8,9,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.topbar{background:rgba(8,8,9,.55)}
.card{background:linear-gradient(180deg,rgba(32,28,22,.62),rgba(13,12,11,.72));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-color:rgba(212,175,106,.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 24px 60px rgba(0,0,0,.45);transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{border-color:rgba(212,175,106,.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 30px 70px rgba(0,0,0,.55),0 0 40px rgba(212,175,106,.07)}
.card.lux::before{display:none}
.card.lux::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),transparent 0 55%,var(--glow,#d4af6a) 72%,#fff6dc 75%,var(--glow,#d4af6a) 78%,transparent 92%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 5s linear infinite;pointer-events:none}
.card.lux{box-shadow:0 0 70px rgba(212,175,106,.10),0 24px 60px rgba(0,0,0,.45)}
.card.lux.sell{--glow:#e5484d;box-shadow:0 0 80px rgba(229,72,77,.16),0 24px 60px rgba(0,0,0,.45)}
.card.lux.buy{--glow:#3fb68b;box-shadow:0 0 80px rgba(63,182,139,.16),0 24px 60px rgba(0,0,0,.45)}
@keyframes spin{to{--ang:360deg}}
.hero h2,.decision h2{text-shadow:0 0 30px currentColor}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{text-shadow:0 0 50px currentColor,0 0 14px currentColor}}
.reveal h2{animation:pop .9s cubic-bezier(.2,1.5,.4,1) both,pulse 2.4s 1s ease-in-out infinite}
.reveal .lrow{animation:rise .5s both}
.reveal .lrow:nth-child(2){animation-delay:.1s}.reveal .lrow:nth-child(3){animation-delay:.2s}.reveal .lrow:nth-child(4){animation-delay:.3s}.reveal .lrow:nth-child(5){animation-delay:.4s}
@keyframes pop{0%{opacity:0;transform:scale(.55);filter:blur(10px)}100%{opacity:1;transform:none;filter:none}}
.garc{animation:garc 1.4s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 0 6px currentColor)}
@keyframes garc{from{stroke-dasharray:0 226}}
.btn{background:linear-gradient(135deg,#f6dc9c,#d4af6a 45%,#a37c36);box-shadow:0 10px 30px rgba(212,175,106,.30),inset 0 1px 0 rgba(255,255,255,.45);position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
.btn.ghost,.btn.outline{background:transparent;box-shadow:none}
.btn.ghost::after,.btn.outline::after{display:none}
.btn.outline:hover{box-shadow:0 0 24px rgba(212,175,106,.25)}
.screen>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.screen>*:nth-child(2){animation-delay:.07s}.screen>*:nth-child(3){animation-delay:.14s}.screen>*:nth-child(4){animation-delay:.21s}.screen>*:nth-child(5){animation-delay:.28s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.nav a[aria-current="page"]{box-shadow:inset -3px 0 0 var(--gold),0 0 30px rgba(212,175,106,.14)}
.nav a[aria-current="page"] svg{filter:drop-shadow(0 0 6px var(--gold))}
.brand svg{filter:drop-shadow(0 0 10px rgba(212,175,106,.6));animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{filter:drop-shadow(0 0 18px rgba(212,175,106,.9))}}
.ticker{position:sticky;top:65px;z-index:19;overflow:hidden;border-bottom:1px solid rgba(212,175,106,.12);background:rgba(8,8,9,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);direction:ltr;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker .track{display:flex;gap:38px;width:max-content;padding:9px 0;animation:marq 50s linear infinite;font-family:var(--f-num);font-size:12.5px;white-space:nowrap}
.ticker .track>span{display:inline-flex;align-items:center;gap:6px}
.ticker b{color:var(--ivory);font-weight:500}
@keyframes marq{to{transform:translateX(-50%)}}
@media (max-width:860px){.ticker{top:64px}}
.scan{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:radial-gradient(circle at center,rgba(26,20,10,.85),rgba(0,0,0,.94));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadein .25s both}
.scan .rad{width:240px;height:240px;position:relative;margin:0 auto}
.scan .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(240,210,143,.7),rgba(212,175,106,.15) 18%,transparent 26%);animation:rot 1.2s linear infinite;-webkit-mask:radial-gradient(circle,#000 69%,transparent 70%);mask:radial-gradient(circle,#000 69%,transparent 70%)}
.scan .blip{position:absolute;width:8px;height:8px;border-radius:50%;background:#f0d28f;box-shadow:0 0 14px #f0d28f;animation:blip 1.2s ease-out infinite}
@keyframes blip{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(.6)}}
.scan .steps{margin-top:26px;display:grid;gap:8px;font-size:15px}
.scan .steps div{opacity:.22;transition:opacity .25s,color .25s}
.scan .steps div.on{opacity:1;color:var(--gold);text-shadow:0 0 16px rgba(212,175,106,.7)}
.scan .ttl{font-family:var(--f-display);font-size:26px;margin-top:18px}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0}}
.stage{background:transparent}
.toast{background:rgba(26,24,22,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 30px rgba(212,175,106,.12),0 12px 30px rgba(0,0,0,.4);animation:rise .4s both}
@media (prefers-reduced-motion:reduce){.aurora,#fx{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== MOBILE APP EDITION ===== */
body{min-height:100dvh}
.device{position:relative;z-index:1;width:100%;max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
@media (min-width:640px){
  body{display:flex;align-items:center;justify-content:center;padding:24px}
  .device{height:min(940px,calc(100dvh - 48px));min-height:0;border-radius:44px;overflow-y:auto;overflow-x:hidden;border:1px solid rgba(212,175,106,.22);background:rgba(8,8,9,.55);box-shadow:0 0 0 10px rgba(20,18,15,.9),0 0 0 11px rgba(212,175,106,.18),0 50px 120px rgba(0,0,0,.7),0 0 120px rgba(212,175,106,.10);scrollbar-width:none}
  .device::-webkit-scrollbar{display:none}
}
.device #view{flex:1}
.device .screen{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 26px;max-width:none;gap:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.apphead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.apphead .hello{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.2}
.ptitle{margin:0;font-family:var(--f-display);font-size:28px;font-weight:700}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;color:#1a1408;background:radial-gradient(circle at 30% 25%,#f8e3a6,#b8893a);box-shadow:0 0 0 2px #0a0a0b,0 0 0 3.5px rgba(212,175,106,.6),0 0 22px rgba(212,175,106,.35)}
.avatar.big{width:56px;height:56px;font-size:22px}
.iconbtn{background:rgba(255,255,255,.04);border-color:rgba(212,175,106,.18);border-radius:14px;width:44px;height:44px;color:var(--ivory)}
.iconbtn .dot{top:9px;left:10px;box-shadow:0 0 8px var(--sell)}
.aicon{display:inline-grid;place-items:center;border-radius:50%;color:#14110b;font-family:var(--f-num);font-weight:500;flex:0 0 auto;box-shadow:inset 0 -6px 12px rgba(0,0,0,.25),inset 0 2px 4px rgba(255,255,255,.5)}

/* stories */
.stories{display:flex;gap:14px;overflow-x:auto;margin:0 -16px;padding:4px 16px 2px;scrollbar-width:none;scroll-snap-type:x proximity}
.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 auto;display:grid;justify-items:center;gap:4px;border:0;background:transparent;padding:0;scroll-snap-align:start;width:66px}
.sring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;padding:2.5px;position:relative}
.sring::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:#0a0a0b;z-index:0}
.sring .aicon{position:relative;z-index:1}
.story.on .sring{box-shadow:0 0 18px rgba(212,175,106,.45);animation:breathe2 2.6s ease-in-out infinite}
@keyframes breathe2{50%{box-shadow:0 0 28px rgba(212,175,106,.7)}}
.sname{font-size:11.5px;color:var(--ivory);white-space:nowrap}
.sval{font-size:10.5px;direction:ltr}

/* carousel */
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 6px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.hcard{flex:0 0 calc(100% - 32px);scroll-snap-align:center;position:relative;overflow:hidden;border-radius:28px;padding:18px;text-decoration:none;color:var(--ivory);background:linear-gradient(155deg,color-mix(in srgb,var(--c2) 40%,#0d0c0b),#0c0b0a 70%);border:1px solid color-mix(in srgb,var(--c1) 35%,transparent);box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.hglow{position:absolute;width:260px;height:260px;border-radius:50%;top:-120px;left:-80px;background:radial-gradient(circle,color-mix(in srgb,var(--c1) 55%,transparent),transparent 65%);filter:blur(10px);opacity:.55;animation:drift1 14s ease-in-out infinite alternate;pointer-events:none}
.hprice{position:relative;font-family:var(--f-num);font-size:40px;font-weight:500;letter-spacing:-.02em;direction:ltr;text-align:right;margin-top:12px;background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--c1) 80%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px color-mix(in srgb,var(--c1) 45%,transparent))}
.hcard svg{position:relative}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dots i{width:6px;height:6px;border-radius:9px;background:#3a342b;transition:width .3s,background .3s}
.dots i.on{width:22px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.chgpill{display:inline-block;font-family:var(--f-num);font-size:12.5px;padding:4px 10px;border-radius:999px;direction:ltr;unicode-bidi:isolate}
.chgpill.sm{font-size:11.5px;padding:2px 8px;margin-top:3px}
.chgpill.pup,.pup{background:rgba(63,182,139,.16);color:var(--buy)}
.chgpill.pdn,.pdn{background:rgba(229,72,77,.16);color:var(--sell)}
.chgpill.up,.chgpill.dn{background:rgba(255,255,255,.06)}

/* quick actions */
.qactions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qactions a,.qactions button{display:grid;justify-items:center;gap:7px;font-size:12px;color:var(--ivory);text-decoration:none;border:0;background:transparent;padding:0}
.qi{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;color:var(--gold);background:linear-gradient(160deg,rgba(212,175,106,.16),rgba(212,175,106,.03));border:1px solid rgba(212,175,106,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 24px rgba(0,0,0,.35);transition:transform .2s,box-shadow .2s}
.qactions a:active .qi,.qactions button:active .qi{transform:scale(.92)}
.qactions a:hover .qi,.qactions button:hover .qi{box-shadow:0 0 24px rgba(212,175,106,.3)}

.miniradar{width:70px;height:70px;border-radius:50%;position:relative;flex:0 0 auto;border:1px solid rgba(212,175,106,.35);background:repeating-radial-gradient(circle,transparent 0 11px,rgba(212,175,106,.18) 11px 12px)}
.miniradar span{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(240,210,143,.7),transparent 28%);animation:rot 2s linear infinite}
.sessbar{position:relative;height:40px;margin-top:4px;border-radius:10px;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),#1e1c19 calc(25% - 1px) 25%)}
.sessbar i{position:absolute;height:6px;border-radius:9px}
.sessbar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;box-shadow:0 0 10px #fff;border-radius:2px}
.sessbar b::after{content:"";position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-radius:50%;background:#fff}
.sesslegend{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px}
.sesslegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px}
.orow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px}
.obadge{font-size:12px;font-weight:700;border-radius:10px;padding:6px 10px}
.ostr{position:relative;width:44px;height:44px;display:grid;place-items:center}
.ostr svg{position:absolute;inset:0}
.ostr b{font-size:12px;font-weight:500}

/* markets */
.searchbox{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 16px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(212,175,106,.16);color:var(--muted)}
.searchbox input{flex:1;border:0;background:transparent;color:var(--ivory);font-size:15px;min-height:48px}

.hscroll{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex:0 0 auto}
.mlist{padding:4px 14px}
.mrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto 34px;gap:10px;align-items:center;padding:12px 0;color:inherit;text-decoration:none}

/* chart */
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.assetbtn{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;text-align:right;min-height:44px}
.cprice{font-size:24px;filter:drop-shadow(0 0 12px rgba(212,175,106,.3))}
.seg.wide{display:grid;grid-template-columns:repeat(6,1fr)}
.chartbox{overflow:hidden;border-radius:24px;padding:0}
.device .stage{height:max(360px,calc(100dvh - 430px));min-height:360px}

.tabbar a[aria-current="page"]{color:var(--gold)}
.tabbar a[aria-current="page"] svg{filter:drop-shadow(0 0 8px var(--gold))}
.tabbar a[aria-current="page"]::after{content:"";position:absolute;bottom:2px;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.radarbtn{justify-self:center;width:72px;height:72px;margin-top:-34px;border-radius:50%;border:0;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 30% 25%,#fbe6ad,#d4af6a 50%,#8f6a28);box-shadow:0 0 0 6px #0c0b0a,0 0 0 7px rgba(212,175,106,.4),0 14px 34px rgba(212,175,106,.45),0 0 50px rgba(212,175,106,.35)}

.radarbtn:active{transform:scale(.94)}

.auth.out{opacity:0;pointer-events:none}
.aframe{position:relative;width:min(460px,100%);min-height:100dvh;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(120% 70% at 50% 20%,#1c160c,#0a0908 50%,#030304)}
@media (min-width:640px){.aframe{min-height:0;height:min(940px,calc(100dvh - 48px));border-radius:44px;box-shadow:0 0 0 10px rgba(20,18,15,.9),0 0 0 11px rgba(212,175,106,.25)}}
.ahead{position:relative;display:flex;align-items:center;gap:14px}
.ahead h1{margin:2px 0 0;font-family:var(--f-display);font-size:32px}
.seg2{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(212,175,106,.18)}
.seg2 button{min-height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:600}
.seg2 button[aria-selected="true"]{background:linear-gradient(135deg,#f6dc9c,#d4af6a 50%,#a37c36);color:#1a1408}
.aform{position:relative;display:grid;gap:12px}
.aform .field input{min-height:52px;border-radius:16px;font-size:15px;background:rgba(0,0,0,.4);border-color:rgba(212,175,106,.22)}
.aform .field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,106,.18)}
.aform .btn{min-height:56px;font-size:16px}
.aerr{margin:0;min-height:18px;color:var(--sell);font-size:13px}
.maint{position:fixed;inset:0;z-index:104;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,#1c160c,#030304 70%)}
.maint h2{font-family:var(--f-display);font-size:26px;margin:14px 0 6px}
.maint p{color:#cfc7b7;max-width:32ch;line-height:1.7;margin:0 auto 10px}
.banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:linear-gradient(90deg,rgba(212,175,106,.18),rgba(212,175,106,.05));border:1px solid rgba(212,175,106,.35);color:var(--ivory);font-size:13.5px;animation:rise .5s both}
.banner svg{color:var(--gold);flex:0 0 auto}
.ownerbar{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;border-radius:12px;border:1px dashed rgba(212,175,106,.45);color:var(--gold);text-decoration:none;font-size:12.5px;background:rgba(212,175,106,.06)}
.official{display:inline-block;padding:2px 10px;border-radius:99px;background:linear-gradient(135deg,#f6dc9c,#d4af6a);color:#1a1408;font-weight:700;font-size:11px}
.sigrail{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.sigrail::-webkit-scrollbar{display:none}
.sigcard{flex:0 0 min(270px,80%);scroll-snap-align:start;padding:14px;border-radius:22px;background:linear-gradient(160deg,rgba(32,28,22,.85),rgba(12,11,10,.9));border:1px solid rgba(212,175,106,.25);display:grid;gap:10px}
.sigcard.sell{border-color:rgba(229,72,77,.4);box-shadow:0 0 30px rgba(229,72,77,.1)}
.sigcard.buy{border-color:rgba(63,182,139,.4);box-shadow:0 0 30px rgba(63,182,139,.1)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sgrid div{border-radius:12px;padding:7px 4px;text-align:center;font-size:10.5px;color:var(--muted);background:rgba(0,0,0,.3)}
.sgrid b{display:block;font-family:var(--f-num);font-weight:500;font-size:12.5px;direction:ltr}
.snote{margin:0;font-size:12.5px;color:#d9d2c5;line-height:1.6}
.acct{display:flex;align-items:center;gap:12px}
.ownercard{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ivory)}
.admhero .admstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.admstats div{text-align:center;padding:10px 4px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid var(--line2)}
.admstats b{display:block;font-size:20px;font-weight:500;color:var(--ivory)}
.admstats span{font-size:11px;color:var(--muted)}
.ta,.tin{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ivory);padding:10px 12px;font:inherit;font-size:14px;resize:vertical;min-height:44px}
.ta:focus,.tin:focus{outline:none;border-color:var(--gold)}
.admin .field select,.admin .field input{background:rgba(0,0,0,.35)}
.admsig,.admmem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;font-size:13.5px}
