<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>biquote live test</title>
<style>
body{margin:0;background:#0b1424;color:#e6eaf2;font:14px/1.5 ui-monospace,Menlo,monospace;padding:14px}
h1{font-size:16px;color:#e8c35a;margin:0 0 8px}
#status{margin:6px 0 12px;color:#8c99ad}
#log{white-space:pre-wrap;word-break:break-all;background:#070d17;border:1px solid #1f2d46;border-radius:10px;padding:10px;max-height:70vh;overflow:auto}
.ok{color:#2fd08b}.bad{color:#ff6464}
</style></head><body>
<h1>biquote live test</h1>
<div id="status">starting...</div>
<div id="log"></div>
<script>
var statusEl = document.getElementById("status"), logEl = document.getElementById("log");
function line(t, cls){ var d = document.createElement("div"); if (cls) d.className = cls; d.textContent = t; logEl.insertBefore(d, logEl.firstChild); }
function status(t, cls){ statusEl.textContent = t; statusEl.className = cls || ""; }
var SYMS = ["XAUUSD", "EURUSD", "GBPUSD"];

// Plan A: plain WebSocket to the hub (no SignalR negotiation).
// SignalR JSON protocol: messages are separated by the 0x1e character.
function tryWebSocket() {
  var ws;
  try { ws = new WebSocket("wss://biquote.io/hubs/tick"); } catch (e) { line("WebSocket constructor failed: " + e, "bad"); return fallback(); }
  var opened = false;
  ws.onopen = function () {
    opened = true;
    ws.send(JSON.stringify({ protocol: "json", version: 1 }) + "\u001e");
    ws.send(JSON.stringify({ type: 1, target: "Subscribe", arguments: [SYMS] }) + "\u001e");
    status("WebSocket connected (plan A)", "ok");
  };
  ws.onmessage = function (ev) {
    String(ev.data).split("\u001e").forEach(function (part) {
      if (!part) return;
      try {
        var m = JSON.parse(part);
        if (m.type === 1 && m.target === "ReceiveTick") line(new Date().toLocaleTimeString() + "  " + JSON.stringify(m.arguments[0]));
        else if (m.type === 6) { /* ping */ }
        else line("other: " + part.slice(0, 200));
      } catch (e) { line("raw: " + part.slice(0, 200)); }
    });
  };
  ws.onerror = function () { line("WebSocket error", "bad"); };
  ws.onclose = function () { if (!opened) fallback(); else status("WebSocket closed", "bad"); };
}

// Plan B: plain HTTP polling of /api/latest (batch, all symbols in one request).
var pollTimer = null;
function fallback() {
  status("Plan B: polling /api/latest every 15 seconds", "");
  function poll() {
    var q = SYMS.map(function (s) { return "symbols=" + s; }).join("&");
    fetch("https://biquote.io/api/latest?" + q, { cache: "no-store" })
      .then(function (r) { return r.text().then(function (t) { return { ok: r.ok, code: r.status, t: t }; }); })
      .then(function (x) {
        if (!x.ok) { line("HTTP " + x.code + ": " + x.t.slice(0, 200), "bad"); return; }
        line(new Date().toLocaleTimeString() + "  " + x.t.slice(0, 400));
      })
      .catch(function (e) { line("fetch failed: " + e, "bad"); });
  }
  poll();
  pollTimer = setInterval(poll, 15000);
}

tryWebSocket();
</script></body></html>
