<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const cv = document.getElementById("c");
const g = cv.getContext("2d");
const W = 1080, H = 1920;

const CAPTIONS = [
  [0, 8, "Teddy is ready for the pool!", "Always swim with a grown-up nearby."],
  [8, 16, "Floating like a little boat.", "Arms out, face up, and breathe slowly."],
  [16, 24, "Kick, kick, splash!", "Small kicks help you move forward."],
  [24, 32, "Great job, Teddy!", "Ask a grown-up to help you practise."],
];

function caption(t) {
  return CAPTIONS.find(c => t >= c[0] && t < c[1]) || CAPTIONS[CAPTIONS.length - 1];
}

function sky(t) {
  const gr = g.createLinearGradient(0, 0, 0, 1000);
  gr.addColorStop(0, "#8fd8ff");
  gr.addColorStop(1, "#e9f9ff");
  g.fillStyle = gr;
  g.fillRect(0, 0, W, 1000);
  // sun with soft glow
  const sx = 860, sy = 240;
  const glow = g.createRadialGradient(sx, sy, 20, sx, sy, 220);
  glow.addColorStop(0, "rgba(255,240,160,0.95)");
  glow.addColorStop(1, "rgba(255,240,160,0)");
  g.fillStyle = glow; g.fillRect(sx - 240, sy - 240, 480, 480);
  g.fillStyle = "#ffd84d";
  g.beginPath(); g.arc(sx, sy, 70, 0, Math.PI * 2); g.fill();
}

function pool(t) {
  const top = 980, bottom = 1920;
  const gr = g.createLinearGradient(0, top, 0, bottom);
  gr.addColorStop(0, "#3fd0e8");
  gr.addColorStop(0.5, "#1ea8d6");
  gr.addColorStop(1, "#0a6fa6");
  g.fillStyle = gr;
  g.fillRect(0, top, W, bottom - top);
  // tiles on the pool floor, drawn through the water
  g.strokeStyle = "rgba(255,255,255,0.12)";
  g.lineWidth = 3;
  for (let y = top + 40; y < bottom; y += 90) {
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
  }
  for (let x = 0; x < W; x += 120) {
    g.beginPath(); g.moveTo(x, top); g.lineTo(x, bottom); g.stroke();
  }
  // animated surface wave
  g.fillStyle = "rgba(255,255,255,0.55)";
  g.beginPath();
  g.moveTo(0, top);
  for (let x = 0; x <= W; x += 20) {
    const y = top + Math.sin(x / 90 + t * 2.2) * 7 + Math.sin(x / 37 - t * 3.1) * 3;
    g.lineTo(x, y);
  }
  g.lineTo(W, top + 14); g.lineTo(0, top + 14); g.closePath(); g.fill();
}

function deck() {
  g.fillStyle = "#f2c46d";
  g.fillRect(0, 1880, W, 40);
  g.fillStyle = "#e4a94f";
  for (let x = 0; x < W; x += 140) g.fillRect(x, 1880, 4, 40);
}

function lifeguard(t) {
  const x = 170, y = 760;
  // chair
  g.fillStyle = "#ff6b6b";
  g.fillRect(x - 60, y + 140, 14, 120);
  g.fillRect(x + 60, y + 140, 14, 120);
  g.fillRect(x - 70, y + 100, 160, 16);
  // body
  g.fillStyle = "#ff4d4d";
  g.beginPath(); g.ellipse(x, y + 60, 60, 90, 0, 0, Math.PI * 2); g.fill();
  // head
  g.fillStyle = "#ffd3b0";
  g.beginPath(); g.arc(x, y - 40, 42, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#3b2a1f";
  g.beginPath(); g.arc(x, y - 58, 44, Math.PI, 0); g.fill();
  // whistle wave
  const wave = Math.sin(t * 4) > 0 ? 1 : 0;
  if (wave) { g.fillStyle = "#333"; g.fillRect(x + 36, y + 20, 14, 8); }
}

// Teddy bear: layered soft shapes with radial shading (a stylised 3D feel).
function soft(cx, cy, r, base, hi) {
  const gr = g.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
  gr.addColorStop(0, hi);
  gr.addColorStop(1, base);
  g.fillStyle = gr;
  g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
}

function teddy(t, x, y, scale, bob) {
  g.save();
  g.translate(x, y + bob);
  g.scale(scale, scale);
  const brown = "#a0622d", light = "#d89a5b";
  // ears
  soft(-95, -150, 42, brown, light);
  soft(95, -150, 42, brown, light);
  // head
  soft(0, -100, 130, brown, light);
  // snout
  soft(0, -50, 55, "#e7b983", "#fff0d6");
  g.fillStyle = "#2b1a10";
  g.beginPath(); g.arc(0, -66, 12, 0, Math.PI * 2); g.fill();
  // eyes with highlights
  for (const ex of [-45, 45]) {
    g.fillStyle = "#1d130b";
    g.beginPath(); g.arc(ex, -120, 14, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#ffffff";
    g.beginPath(); g.arc(ex + 5, -125, 5, 0, Math.PI * 2); g.fill();
  }
  // smile
  g.strokeStyle = "#2b1a10"; g.lineWidth = 6; g.lineCap = "round";
  g.beginPath(); g.arc(0, -52, 22, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke();
  // yellow swim cap
  g.fillStyle = "#ffd23f";
  g.beginPath(); g.arc(0, -190, 120, Math.PI * 1.02, Math.PI * 1.98); g.closePath(); g.fill();
  // body
  soft(0, 20, 110, brown, light);
  // arms
  soft(-150, 0, 40, brown, light);
  soft(150, 0, 40, brown, light);
  g.restore();
}

function ring(t) {
  const x = 540, y = 1310 + Math.sin(t * 2) * 6;
  g.strokeStyle = "#ff7aa2";
  g.lineWidth = 36;
  g.beginPath(); g.ellipse(x, y, 110, 46, 0, 0, Math.PI * 2); g.stroke();
  g.strokeStyle = "rgba(255,255,255,0.7)";
  g.lineWidth = 6;
  g.beginPath(); g.ellipse(x, y, 110, 46, 0, 0, Math.PI * 2); g.stroke();
}

function duck(t) {
  const x = 820, y = 1260 + Math.sin(t * 3) * 5;
  soft(x, y, 56, "#ffcf33", "#fff3a6");
  g.fillStyle = "#ff8a00";
  g.beginPath(); g.moveTo(x + 50, y); g.lineTo(x + 84, y + 8); g.lineTo(x + 50, y + 18); g.fill();
  g.fillStyle = "#1d130b";
  g.beginPath(); g.arc(x + 20, y - 18, 7, 0, Math.PI * 2); g.fill();
}

function bubbles(t) {
  for (let i = 0; i < 14; i++) {
    const p = (t * 0.25 + i / 14) % 1;
    const x = 200 + (i * 61) % 700 + Math.sin(t * 2 + i) * 18;
    const y = 1800 - p * 700;
    g.strokeStyle = "rgba(255,255,255,0.85)";
    g.lineWidth = 4;
    g.beginPath(); g.arc(x, y, 8 + (i % 4) * 4, 0, Math.PI * 2); g.stroke();
  }
}

function text(t) {
  const [, , a, b] = caption(t);
  g.fillStyle = "rgba(10,30,50,0.55)";
  g.fillRect(60, 1380, 960, 240);
  g.fillStyle = "#ffffff";
  g.font = "bold 62px DejaVu Sans, sans-serif";
  g.fillText(a, 96, 1470);
  g.font = "42px DejaVu Sans, sans-serif";
  g.fillStyle = "#e8f7ff";
  g.fillText(b, 96, 1550);
}

function teddyPose(t) {
  // 0-8: stands at edge; 8-16: floats; 16-24: kicks; 24-32: exits
  if (t < 8) return { x: 540, y: 1000 - 4 + Math.sin(t * 2) * 3, s: 0.42, bob: Math.sin(t * 2) * 6 };
  if (t < 16) return { x: 540, y: 1200, s: 0.4, bob: Math.sin(t * 2) * 8 };
  if (t < 24) return { x: 540 + Math.sin(t * 3) * 40, y: 1200, s: 0.4, bob: Math.sin(t * 4) * 10 };
  const k = Math.min(1, (t - 24) / 8);
  return { x: 540 + k * 300, y: 1200 - k * 140, s: 0.4 - k * 0.05, bob: 0 };
}

window.renderFrame = function (t) {
  g.clearRect(0, 0, W, H);
  sky(t);
  deck();
  pool(t);
  lifeguard(t);
  ring(t);
  const p = teddyPose(t);
  teddy(t, p.x, p.y, p.s, p.bob);
  if (t >= 16 && t < 24) duck(t);
  bubbles(t);
  text(t);
};
window.renderFrame(0);
</script>
</body></html>
